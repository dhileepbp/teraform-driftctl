database: driftctl.db

api:
  addr: ":8080"
  # api_key: "change-me-in-production"

# Credentials are read from environment variables and are never stored here.
# Use bot_token_env for reliable delivery to multiple channels. Incoming
# webhooks may be used instead with webhook_env.
notifications:
  slack:
    enabled: false
    bot_token_env: SLACK_BOT_TOKEN
    channels:
      - "#terraform-drift"
    notify_on:
      - drift
      - error
    max_findings: 10

workspaces:
  - name: prod
    provider: aws
    state:
      backend: local
      path: testdata/state/sample.tfstate
    regions:
      - us-east-1
    compare:
      ignore_tags:
        - tfdriftctl_scan
    schedule:
      cron: "0 */6 * * *"

  # Azure workspaces use subscription-scoped Resource Graph discovery.
  # - name: azure-prod
  #   provider: azure
  #   state:
  #     backend: local
  #     path: terraform.tfstate
  #   subscriptions:
  #     - 00000000-0000-0000-0000-000000000000
  #   schedule:
  #     cron: "0 */6 * * *"
