database: driftctl.db

# Credentials are read from environment variables and are never stored here.
# Use bot_token_env for reliable delivery to multiple channels. Incoming
# webhooks may be used instead with webhook_env.
notifications:
  slack:
    enabled: false
    bot_token_env: SLACK_BOT_TOKEN
    channels:
      - "#terraform-drift"
    notify_on:
      - drift
      - error
    max_findings: 10

workspaces:
  - name: azure-prod
    provider: azure
    state:
      backend: local
      path: testdata/state/azure-sample.tfstate
    subscriptions:
      - 11111111-1111-1111-1111-111111111111
      - 22222222-2222-2222-2222-222222222222
    compare:
      ignore_tags:
        - tfdriftctl_scan
